<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Family Tree | GitHub Connection Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }
    main {
      width: min(100%, 440px);
      padding: 36px 28px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 12px 40px #23395b15;
      text-align: center;
    }
    .icon { font-size: 40px; }
    h1 { font-size: 24px; margin: 16px 0 12px; }
    p { margin: 8px 0; line-height: 1.7; }
    small { color: #64748b; }
    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #f9fafb; }
      main { background: #1f2937; box-shadow: none; }
      small { color: #cbd5e1; }
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">✅</div>
    <h1>Codex Cloud Test - Success!</h1>
    <p>GitHubへのファイル作成テスト成功</p>
    <small>Family Tree / test/test_index.html</small>
  </main>
</body>
</html>
