<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#183f38">
  <meta name="description" content="A private, browser-based multilingual family tree editor.">
  <title>Family Tree · Ver.1</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23183f38'/%3E%3Cpath d='M24 35V22M13 30h22M13 30v5m22-5v5' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Ccircle cx='24' cy='14' r='6' fill='%239bd0b5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="./" aria-label="Family Tree">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 36 36"><path d="M18 29V17M8 25h20M8 25v5m20-5v5"/><circle cx="18" cy="9" r="5"/></svg></span>
      <span><strong>Family Tree</strong><small data-i18n="app.subtitle"></small></span><span class="version">V.1</span>
    </a>
    <nav class="view-tabs" aria-label="View">
      <button type="button" class="active" data-view="tree" data-i18n="nav.tree"></button>
      <button type="button" data-view="roster" data-i18n="nav.roster"></button>
    </nav>
    <div class="header-actions">
      <select id="language" aria-label="Language"><option value="ja">日本語</option><option value="en">English</option><option value="vi">Tiếng Việt</option></select>
      <button type="button" id="help-button" class="icon-button" data-i18n-title="label.help">?</button>
    </div>
  </header>
  <main id="workspace">
    <section class="workspace-toolbar">
      <div><h1 id="view-title" data-i18n="nav.tree"></h1><span id="summary" class="summary"></span></div>
      <div class="toolbar-actions">
        <button type="button" id="import-button" class="secondary" data-i18n="action.import"></button>
        <button type="button" id="export-button" class="secondary" data-i18n="action.export"></button>
        <button type="button" id="add-button" class="primary"><span aria-hidden="true">＋</span><span data-i18n="action.addPerson"></span></button>
      </div>
    </section>
    <div id="interaction-banner" class="interaction-banner" hidden><div><strong id="interaction-title"></strong><span id="interaction-detail"></span></div><div class="banner-actions"><button type="button" id="place-root" data-i18n="action.newRoot" hidden></button><button type="button" id="target-list" data-i18n="action.choose"></button><button type="button" id="cancel-mode" data-i18n="action.cancel"></button></div></div>
    <section id="tree-view" class="tree-view" aria-label="Family tree">
      <div id="viewport" class="viewport" tabindex="0"><div id="world" class="world"><svg id="relations" class="relations" aria-hidden="true"></svg><div id="cards"></div><div id="family-anchors"></div><div id="placement-targets"></div></div></div>
      <aside class="canvas-note"><span class="note-icon" aria-hidden="true">⌘</span><p data-i18n="label.privacy"></p></aside>
      <div id="draft-tray" class="draft-tray" hidden></div>
      <div id="empty-state" class="empty-state" hidden><span class="empty-icon" aria-hidden="true">♧</span><h2 data-i18n="label.emptyTree"></h2><p data-i18n="label.emptyTreeHelp"></p><button type="button" class="primary" id="empty-add" data-i18n="action.addPerson"></button></div>
      <div id="loading" class="loading" role="status" data-i18n="label.loading"></div>
      <div class="canvas-footer"><span class="legend"><i></i><span data-i18n="label.biological"></span><i class="dashed"></i><span data-i18n="label.adopted"></span></span><div class="zoom-controls"><button type="button" id="zoom-out" data-i18n-title="action.zoomOut">−</button><output id="zoom-value">100%</output><button type="button" id="zoom-in" data-i18n-title="action.zoomIn">＋</button><span></span><button type="button" id="fit-button" class="fit-button" data-i18n="action.fit"></button></div></div>
    </section>
    <section id="roster-view" class="roster-view" hidden><div class="roster-heading"><h2 data-i18n="label.roster"></h2><input type="search" id="roster-search" data-i18n-placeholder="label.search" aria-label="Search"></div><div id="roster-content"></div></section>
    <footer class="status-bar"><span id="status-message" data-i18n="label.saveReminder"></span><span>Family Tree · 1.0</span></footer>
  </main>
  <dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-header"><h2 id="sheet-title"></h2><button type="button" id="sheet-close" class="icon-button" data-i18n-title="action.close">×</button></div><div id="sheet-body" class="sheet-body"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input id="file-input" type="file" accept=".json,application/json" hidden>
  <script src="../vendor/jquery/3.7.1/jquery.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
